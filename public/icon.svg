<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Dark rounded background — keeps the icon legible on both light and dark
       browser chrome without needing a media-query swap. -->
  <rect width="180" height="180" rx="32" fill="#0b0f14"/>

  <!-- Subtle inner border so the icon has a visible edge against very dark
       backgrounds. -->
  <rect x="2" y="2" width="176" height="176" rx="30" fill="none"
        stroke="#1f2937" stroke-width="1.5"/>

  <defs>
    <!-- Diagonal bridge: green at top (CYPH) → orange at bottom (ZEC),
         visually wires the two brand bars together. -->
    <linearGradient id="zcDiag" x1="148" y1="42" x2="32" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Stylized Zcash-style "Z":
         · Top bar  = CYPH green (#34d399)   ← Cypherpunk Holdings
         · Diagonal = green→orange gradient  ← the ratio/bridge
         · Bottom bar = ZEC orange (#fb923c) ← Zcash
       Single mark, instantly readable, encodes both brands' colors. -->
  <rect x="32" y="38" width="116" height="22" rx="3" fill="#34d399"/>
  <polygon points="130,42 148,42 50,138 32,138" fill="url(#zcDiag)"/>
  <rect x="32" y="120" width="116" height="22" rx="3" fill="#fb923c"/>

  <!-- Small dot in the negative space (top-right) — a cypherpunk-style
       "transmission" pip that breaks the symmetry. -->
  <circle cx="146" cy="78" r="3.5" fill="#34d399" opacity="0.85"/>
  <!-- Mirror dot bottom-left -->
  <circle cx="34" cy="102" r="3.5" fill="#fb923c" opacity="0.85"/>
</svg>
